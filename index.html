     Dashboard redesign + searchable countries/services

<style>
  /* =========================================================
     PASSWORD VISIBILITY
     ========================================================= */

  .gvs-password-wrap {
    position: relative;
    width: 100%;
  }

  .gvs-password-wrap input {
    padding-right: 52px !important;
  }

  .gvs-password-toggle {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 40px;
    border: 0;
    background: transparent;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    z-index: 5;

  .gvs-password-toggle:hover {
    background: rgba(37, 99, 235, 0.08);
  }


  /* =========================================================
     SEARCHABLE SELECTS
     ========================================================= */

  .gvs-search-select {
    position: relative;
    width: 100%;
  }

  .gvs-select-display {
    width: 100%;
    min-height: 52px;
    border: 1px solid #dbe4f0;
    background: #ffffff;
    border-radius: 12px;
    padding: 0 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    color: #111827;
    cursor: pointer;
    text-align: left;
    transition: 0.2s ease;
  }

  .gvs-select-display:hover,
  .gvs-search-select.open .gvs-select-display {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
  }

  .gvs-selected-content {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .gvs-selected-label {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .gvs-chevron {
    font-size: 18px;
    flex: 0 0 auto;
    transition: transform 0.2s ease;
  }

  .gvs-search-select.open .gvs-chevron {
    transform: rotate(180deg);
  }

  .gvs-dropdown {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(100% + 7px);
    background: #ffffff;
    border: 1px solid #dbe4f0;
    border-radius: 14px;
    box-shadow: 0 18px 45px rgba(15, 23, 42, 0.16);
    z-index: 5000;
    overflow: hidden;
    display: none;
  }

  .gvs-search-select.open .gvs-dropdown {
    display: block;
  }

  .gvs-search-box {
    padding: 10px;
    border-bottom: 1px solid #edf1f7;
    background: #f8fafc;
  }

  .gvs-search-input {
    width: 100%;
    height: 44px;
    border: 1px solid #dbe4f0;
    border-radius: 10px;
    padding: 0 13px;
    outline: none;
    background: #ffffff;
  }

  .gvs-search-input:focus {
    border-color: #2563eb;
  }

  .gvs-options {
    max-height: 300px;
    overflow-y: auto;
  }

  .gvs-option {
    width: 100%;
    min-height: 48px;
    padding: 10px 13px;
    border: 0;
    border-bottom: 1px solid #f1f5f9;
    background: #ffffff;
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;

    cursor: pointer;
  }

  .gvs-option:hover {
    background: #eff6ff;
  }

  .gvs-option.active {
    background: #dbeafe;
    color: #1d4ed8;
    font-weight: 700;
  }

  .gvs-option-icon {
    width: 30px;
    height: 30px;
    flex: 0 0 30px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #eff6ff;
    font-size: 18px;
  }

  .gvs-option-text {
    min-width: 0;
    flex: 1;
  }

  .gvs-option-name {
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .gvs-option-price {
    display: block;
    margin-top: 2px;

  .gvs-no-results {

  }

  .gvs-flag {

  }

     WALLET HERO / DASHBOARD
     ========================================================= */

  .gvs-wallet-hero {
    position: relative;
    overflow: hidden;
    min-height: 300px;
    padding: 34px;
    margin-bottom: 24px;
    border-radius: 30px;
    background:
      radial-gradient(
        circle at 92% 10%,
        rgba(255,255,255,0.18),
        transparent 30%
      ),
      radial-gradient(
        circle at 5% 105%,
        rgba(255,255,255,0.10),
        transparent 28%
      ),
      linear-gradient(
        135deg,
        #2563eb 0%,
        #315fe8 45%,
        #4168ee 100%
      );
    color: #ffffff;
    box-shadow: 0 20px 50px rgba(37, 99, 235, 0.22);
  }

  .gvs-wallet-hero::before {

  .gvs-wallet-status {

  .gvs-status-dot {

  .gvs-add-money-btn {

    min-height: 88px;
    margin-top: 42px;
    border: 0;

    background: #ffffff;

    font-size: 26px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;

  .gvs-add-money-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 18px 35px rgba(15,23,42,0.14);
  }

  .gvs-add-money-icon {
    width: 42px;

    border-radius: 15px;
    background: #eef2ff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    line-height: 1;
  }


  /* =========================================================
     OPAY NOTICE
     ========================================================= */

  .gvs-whatsapp-notice {
    margin-top: 16px;
    padding: 15px 16px;
    border-radius: 12px;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    color: #1e3a8a;
    line-height: 1.55;

  }

  .gvs-whatsapp-notice strong {

  }

  /* =========================================================
     RESPONSIVE
     ========================================================= */

  @media (max-width: 700px) {

      border-radius: 24px;

    }

      margin-top: 30px;
      border-radius: 21px;

    }

      width: 36px;
      height: 36px;
      border-radius: 12px;
    }
  }
</style>


<script>
(function () {

  "use strict";


  /* =========================================================
     SMALL HELPERS
     ========================================================= */

  function gvs$(id) {
    return document.getElementById(id);
  }


  function gvsEscape(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function gvsFlag(code) {

    const value =
      String(code || "")
        .trim()
        .toUpperCase();

    if (!/^[A-Z]{2}$/.test(value)) {
      return "🌐";
    }

    return [...value]
      .map(letter =>
        String.fromCodePoint(
          127397 + letter.charCodeAt(0)
        )
      )
      .join("");

  }


  function gvsServiceIcon(name) {

    const value =
      String(name || "")
        .toLowerCase()
        .trim();

    const icons = {

      whatsapp: "💬",
      telegram: "✈️",
      signal: "🔵",
      instagram: "📷",
      facebook: "📘",
      tiktok: "🎵",
      google: "🔎",
      gmail: "✉️",
      microsoft: "🪟",
      outlook: "📧",
      discord: "🎮",
      twitter: "𝕏",
      x: "𝕏",
      snapchat: "👻",
      uber: "🚕",
      bolt: "🚗",
      airbnb: "🏠",
      amazon: "📦",
      alibaba: "🛒",
      ebay: "🛍️",
      paypal: "💳",
      binance: "₿",
      bybit: "₿",
      coinbase: "🪙",
      foodora: "🍔",
      doordash: "🍔",
      coca: "🥤",
      cocacola: "🥤",
      "coca-cola": "🥤",
      upwork: "💼",
      jiomart: "🛒",
      rapi: "🚗",
      rappi: "🛵"

    };

    for (const key of Object.keys(icons)) {
      if (value.includes(key)) {
        return icons[key];
      }
    }

    return "📱";
  }


  /* =========================================================
     REMOVE WITHDRAWAL COMPLETELY FROM UI
     ========================================================= */

  function removeWithdrawals() {

    document
      .querySelectorAll(
        "form, .section-card, .product-card, div"
      )
      .forEach(element => {

        const text =
          (element.innerText || "")
            .trim()
            .toLowerCase();

        if (
          text.includes("withdraw funds") &&
          text.includes("request a withdrawal")
        ) {
          element.remove();
        }

      });


    document
      .querySelectorAll(
        "#withdrawForm, #withdrawButton, #withdrawBank, #withdrawAccountNumber, #withdrawAccountName, #withdrawAmount"
      )
      .forEach(element => {
        element.remove();
      });

  }


  /* =========================================================
     PASSWORD EYE BUTTONS
     ========================================================= */

  function addPasswordToggle(input) {

    if (!input || input.dataset.gvsPasswordReady === "1") {
      return;
    }

    input.dataset.gvsPasswordReady = "1";

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "gvs-password-wrap";

    input.parentNode.insertBefore(
      wrapper,
      input
    );

    wrapper.appendChild(input);

    const button =
      document.createElement("button");

    button.type = "button";

    button.className =
      "gvs-password-toggle";

    button.innerHTML = "👁️";

    button.setAttribute(
      "aria-label",
      "Show password"
    );

    button.addEventListener(
      "click",
      function () {

        if (input.type === "password") {

          input.type = "text";

          button.innerHTML = "🙈";

          button.setAttribute(
            "aria-label",
            "Hide password"
          );

        } else {

          input.type = "password";

          button.innerHTML = "👁️";

          button.setAttribute(
            "aria-label",
            "Show password"
          );

        }

      }
    );

    wrapper.appendChild(button);

  }


  function setupPasswordToggles() {

    [
      "loginPassword",
      "registerPassword",
      "registerConfirmPassword"
    ].forEach(id => {

      const input = gvs$(id);

      if (input) {
        addPasswordToggle(input);
      }

    });

  }


  /* =========================================================
     SEARCHABLE SELECT CREATOR
     ========================================================= */

  function createSearchableSelect(
    selectId,
    type
  ) {

    const select =
      gvs$(selectId);

    if (!select) {
      return null;
    }

    if (select.dataset.gvsSearchReady === "1") {
      return select.nextElementSibling;
    }

    select.dataset.gvsSearchReady = "1";

    select.style.display = "none";

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "gvs-search-select";

    wrapper.dataset.type =
      type;

    const display =
      document.createElement("button");

    display.type = "button";

    display.className =
      "gvs-select-display";

    display.innerHTML = `
      <span class="gvs-selected-content">
        <span class="gvs-selected-label">
          Select ${type}
        </span>
      </span>
      <span class="gvs-chevron">⌄</span>
    `;

    const dropdown =
      document.createElement("div");

    dropdown.className =
      "gvs-dropdown";

    dropdown.innerHTML = `
      <div class="gvs-search-box">
        <input
          type="search"
          class="gvs-search-input"
          placeholder="Search ${type.toLowerCase()}..."
          autocomplete="off"
        />
      </div>

      <div class="gvs-options"></div>
    `;

    wrapper.appendChild(display);
    wrapper.appendChild(dropdown);

    select.parentNode.insertBefore(
      wrapper,
      select
    );

    const searchInput =
      dropdown.querySelector(
        ".gvs-search-input"
      );

    display.addEventListener(
      "click",
      function (event) {

        event.preventDefault();

        document
          .querySelectorAll(
            ".gvs-search-select.open"
          )
          .forEach(other => {

            if (other !== wrapper) {
              other.classList.remove("open");
            }

          });

        wrapper.classList.toggle("open");

        if (wrapper.classList.contains("open")) {

          setTimeout(
            () => searchInput.focus(),
            50
          );

        }

      }
    );


    searchInput.addEventListener(
      "input",
      function () {
        renderOptions(
          wrapper,
          select,
          type
        );
      }
    );


    document.addEventListener(
      "click",
      function (event) {

        if (!wrapper.contains(event.target)) {
          wrapper.classList.remove("open");
        }

      }
    );


    wrapper._gvsRender =
      function () {

        renderOptions(
          wrapper,
          select,
          type
        );

      };


    renderOptions(
      wrapper,
      select,
      type
    );

    return wrapper;

  }


  function renderOptions(
    wrapper,
    select,
    type
  ) {

    const optionsContainer =
      wrapper.querySelector(
        ".gvs-options"
      );

    const searchInput =
      wrapper.querySelector(
        ".gvs-search-input"
      );

    const query =
      String(
        searchInput?.value || ""
      )
        .toLowerCase()
        .trim();


    const options =
      Array.from(select.options)
        .filter(option =>
          option.value
        )
        .filter(option => {

          const name =
            option.dataset.countryName ||
            option.dataset.serviceName ||
            option.textContent ||
            "";

          return name
            .toLowerCase()
            .includes(query);

        });


    if (!options.length) {

      optionsContainer.innerHTML =
        '<div class="gvs-no-results">No matching results found.</div>';

      return;

    }


    optionsContainer.innerHTML =
      options
        .map(option => {

          const isCountry =
            type === "country";

          const name =
            option.dataset.countryName ||
            option.dataset.serviceName ||
            option.textContent ||
            option.value;

          const raw =
            option.dataset.raw || "{}";

          let data = {};

          try {
            data = JSON.parse(raw);
          } catch (_) {}


          const icon =
            isCountry
              ? gvsFlag(
                  data.code ||
                  data.country_code ||
                  data.countryCode ||
                  ""
                )
              : gvsServiceIcon(name);


          let priceText = "";

          if (!isCountry) {

            const price =
              option.dataset.price;

            if (
              price !== undefined &&
              price !== ""
            ) {

              priceText =
                `<span class="gvs-option-price">
                  ${gvsEscape(
                    typeof formatMoney === "function"
                      ? formatMoney(price)
                      : `₦${price}`
                  )}
                </span>`;

            }

          }


          return `
            <button
              type="button"
              class="gvs-option ${
                select.value === option.value
                  ? "active"
                  : ""
              }"
              data-value="${gvsEscape(option.value)}"
            >

              <span class="gvs-option-icon">
                ${icon}
              </span>

              <span class="gvs-option-text">

                <span class="gvs-option-name">
                  ${gvsEscape(name)}
                </span>

                ${priceText}

              </span>

            </button>
          `;

        })
        .join("");


    optionsContainer
      .querySelectorAll(".gvs-option")
      .forEach(button => {

        button.addEventListener(
          "click",
          function () {

            const value =
              button.dataset.value;

            select.value = value;

            const selected =
              select.options[
                select.selectedIndex
              ];

            const name =
              selected?.dataset?.countryName ||
              selected?.dataset?.serviceName ||
              selected?.textContent ||
              "Select " + type;


            const icon =
              type === "country"
                ? gvsFlag(
                    (() => {

                      try {

                        const data =
                          JSON.parse(
                            selected?.dataset?.raw ||
                            "{}"
                          );

                        return (
                          data.code ||
                          data.country_code ||
                          data.countryCode ||
                          ""
                        );

                      } catch (_) {

                        return "";

                      }

                    })()
                  )
                : gvsServiceIcon(name);


            const label =
              wrapper.querySelector(
                ".gvs-selected-label"
              );

            const content =
              wrapper.querySelector(
                ".gvs-selected-content"
              );


            content.innerHTML = `
              <span class="gvs-flag">
                ${icon}
              </span>

              <span class="gvs-selected-label">
                ${gvsEscape(name)}
              </span>
            `;


            wrapper.classList.remove(
              "open"
            );


            const event =
              new Event(
                "change",
                {
                  bubbles: true
                }
              );

            select.dispatchEvent(event);


            if (type === "country") {

              if (
                typeof loadServices ===
                "function"
              ) {
                loadServices();
              }

            } else {

              if (
                typeof updatePurchasePreview ===
                "function"
              ) {
                updatePurchasePreview();
              }

            }

          }
        );

      });

  }


  /* =========================================================
     REFRESH SEARCHABLE SELECT
     ========================================================= */

  function refreshSearchableSelect(
    selectId
  ) {

    const select =
      gvs$(selectId);

    if (!select) {
      return;
    }

    const wrapper =
      select.nextElementSibling;

    if (
      wrapper &&
      wrapper.classList.contains(
        "gvs-search-select"
      )
    ) {

      if (wrapper._gvsRender) {
        wrapper._gvsRender();
      }

    }

  }


  /* =========================================================
     DASHBOARD HERO
     ========================================================= */

  function buildDashboardHero() {

    const page =
      gvs$("page-home");

    if (!page) {
      return;
    }

    if (
      page.querySelector(
        ".gvs-wallet-hero"
      )
    ) {
      return;
    }


    const hero =
      document.createElement("div");

    hero.className =
      "gvs-wallet-hero";

    hero.innerHTML = `

      <div class="gvs-wallet-hero-content">

        <div class="gvs-wallet-label">
          Wallet Balance
        </div>

        <div class="gvs-wallet-amount-row">

          <div
            id="gvsHeroBalance"
            class="gvs-wallet-amount"
          >
            ₦0.00
          </div>

          <div class="gvs-wallet-status">

            <span class="gvs-status-dot"></span>

            Active

          </div>

        </div>

        <button
          type="button"
          class="gvs-add-money-btn"
          onclick="navigateTo('wallet')"
        >

          <span class="gvs-add-money-icon">
            +
          </span>

          Add Money

        </button>

      </div>

    `;


    const firstElement =
      page.firstElementChild;

    if (firstElement) {

      page.insertBefore(
        hero,
        firstElement
      );

    } else {

      page.appendChild(hero);

    }


    updateHeroBalance();

  }


  function updateHeroBalance() {

    const heroBalance =
      gvs$("gvsHeroBalance");

    if (!heroBalance) {
      return;
    }


    const dashboardBalance =
      gvs$("dashboardBalance");

    const walletBalance =
      gvs$("walletPageBalance");

    const source =
      dashboardBalance ||
      walletBalance;


    if (source) {

      heroBalance.textContent =
        source.textContent ||
        "₦0.00";

    }

  }


  /* =========================================================
     OPAY WHATSAPP NOTICE
     ========================================================= */

  function addOpayNotice() {

    const depositForm =
      gvs$("depositForm");

    if (!depositForm) {
      return;
    }

    if (
      depositForm.parentElement.querySelector(
        ".gvs-whatsapp-notice"
      )
    ) {
      return;
    }


    const notice =
      document.createElement("div");

    notice.className =
      "gvs-whatsapp-notice";

    notice.innerHTML = `
      <strong>Need faster approval?</strong><br>
      After making your OPay payment and submitting your receipt,
      send us a message on WhatsApp at
      <a
        class="gvs-whatsapp-link"
        href="https://wa.me/2349136540119"
        target="_blank"
        rel="noopener noreferrer"
      >
        09136540119
      </a>
      for faster confirmation.
    `;


    depositForm.parentElement.appendChild(
      notice
    );

  }


  /* =========================================================
     IMPROVE PURCHASE ERROR
     ========================================================= */

  function improvePurchaseErrorHandling() {

    if (
      typeof window.purchaseNumber !==
      "function"
    ) {
      return;
    }

    if (
      window.purchaseNumber.__gvsWrapped
    ) {
      return;
    }

    const originalPurchase =
      window.purchaseNumber;

    async function wrappedPurchase() {

      try {

        return await originalPurchase.apply(
          this,
          arguments
        );

      } catch (error) {

        console.error(
          "GlobalSim purchase error:",
          error
        );

        if (
          typeof showToast ===
          "function"
        ) {

          showToast(
            "Unable to process number. Please check your wallet balance and try again.",
            "error"
          );

        }

      }

    }

    wrappedPurchase.__gvsWrapped = true;

    window.purchaseNumber =
      wrappedPurchase;

  }


  /* =========================================================
     WRAP COUNTRY/SERVICE LOADING
     ========================================================= */

  function wrapLoaders() {

    if (
      typeof window.loadCountries ===
        "function" &&
      !window.loadCountries.__gvsWrapped
    ) {

      const originalCountries =
        window.loadCountries;

      async function wrappedCountries() {

        const result =
          await originalCountries.apply(
            this,
            arguments
          );

        refreshSearchableSelect(
          "countrySelect"
        );

        return result;

      }

      wrappedCountries.__gvsWrapped = true;

      window.loadCountries =
        wrappedCountries;

    }


    if (
      typeof window.loadServices ===
        "function" &&
      !window.loadServices.__gvsWrapped
    ) {

      const originalServices =
        window.loadServices;

      async function wrappedServices() {

        const result =
          await originalServices.apply(
            this,
            arguments
          );

        refreshSearchableSelect(
          "serviceSelect"
        );

        return result;

      }

      wrappedServices.__gvsWrapped = true;

      window.loadServices =
        wrappedServices;

    }

  }


  /* =========================================================
     KEEP HERO BALANCE IN SYNC
     ========================================================= */

  function startBalanceObserver() {

    const dashboardBalance =
      gvs$("dashboardBalance");

    const walletBalance =
      gvs$("walletPageBalance");

    [
      dashboardBalance,
      walletBalance
    ]
      .filter(Boolean)
      .forEach(element => {

        const observer =
          new MutationObserver(
            updateHeroBalance
          );

        observer.observe(
          element,
          {
            childList: true,
            characterData: true,
            subtree: true
          }
        );

      });

  }


  /* =========================================================
     INITIALIZE
     ========================================================= */

  function initializeGlobalSimUI() {

    removeWithdrawals();

    setupPasswordToggles();

    createSearchableSelect(
      "countrySelect",
      "country"
    );

    createSearchableSelect(
      "serviceSelect",
      "service"
    );

    buildDashboardHero();

    addOpayNotice();

    wrapLoaders();

    improvePurchaseErrorHandling();

    startBalanceObserver();

    updateHeroBalance();

  }


  /*
    Run after the existing GlobalSim application
    has loaded its normal scripts.
  */

  if (
    document.readyState ===
    "loading"
  ) {

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        setTimeout(
          initializeGlobalSimUI,
          250
        );

      }
    );

  } else {

    setTimeout(
      initializeGlobalSimUI,
      250
    );

  }


})();
</script>
